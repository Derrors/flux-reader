name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/macos/**"
      - "packages/reader-web/**"
      - "scripts/sync-version.js"
      - "scripts/test/**"
      - "scripts/build-macos-dmg.sh"
      - "VERSION"
      - "package.json"
      - ".github/workflows/macos.yml"
      - ".github/workflows/macos-notarized.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "packages/reader-web/**"
      - "scripts/sync-version.js"
      - "scripts/test/**"
      - "scripts/build-macos-dmg.sh"
      - "VERSION"
      - "package.json"
      - ".github/workflows/macos.yml"
      - ".github/workflows/macos-notarized.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always

jobs:
  build-and-test:
    name: Build and test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/reader-web/package-lock.json

      - name: Install shared reader dependencies
        run: npm ci --prefix packages/reader-web --no-audit --no-fund

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test shared reader
        run: npm run test:reader

      - name: Test built reader entries in Chromium
        run: npm run test:render-contract

      - name: Lint Swift sources
        run: |
          npm run version:check
          npm run lint:macos

      - name: Build and run unit tests
        run: npm run test:macos

      - name: Run UI automation suite
        run: npm run test:macos-ui
