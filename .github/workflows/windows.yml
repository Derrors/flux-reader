name: Windows CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/windows/**"
      - "packages/reader-web/**"
      - "contracts/safe-save/**"
      - "scripts/sync-version.js"
      - "scripts/test/**"
      - "VERSION"
      - "package.json"
      - ".github/workflows/windows.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "packages/reader-web/**"
      - "contracts/safe-save/**"
      - "scripts/sync-version.js"
      - "scripts/test/**"
      - "VERSION"
      - "package.json"
      - ".github/workflows/windows.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_REPLACE_REGISTRY_HOST: always
  CARGO_TERM_COLOR: always
  # 契约测试用 include_str! 读取 contracts/safe-save/v1；此处无需额外环境变量。

jobs:
  quality:
    name: Rust quality and shared reader build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/reader-web/package-lock.json

      # windows-latest 自带 rustup 与 stable 工具链；显式声明组件与版本，
      # 避免依赖无法固定 SHA 的第三方 setup action。
      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup component add clippy rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Install shared reader dependencies
        run: npm ci --prefix packages/reader-web --no-audit --no-fund

      # 版本一致性与 fnOS/macOS CI 使用同一门禁，防止 VERSION 与各平台清单漂移。
      - name: Check version consistency
        run: npm run version:check

      # 前端 Windows 入口构建；Rust cargo test 本身不依赖该产物，
      # 但这里提前验证 windows 模式的 Vite 构建不回归。
      - name: Build shared reader (Windows entry)
        run: npm run build:windows-renderer

      - name: Rust format check
        run: cargo fmt --manifest-path apps/windows/src-tauri/Cargo.toml --check

      # windows-latest 上 cfg(windows) 分支(ReplaceFileW、ReadDirectoryChangesW、
      # WebView2 协议映射、windows-sys 调用)在此首次获得真实编译验证。
      - name: Rust check
        run: cargo check --manifest-path apps/windows/src-tauri/Cargo.toml --locked

      - name: Rust tests (includes shared safe-save v1 scenarios)
        run: cargo test --manifest-path apps/windows/src-tauri/Cargo.toml --locked

      - name: Rust clippy (deny warnings)
        run: cargo clippy --manifest-path apps/windows/src-tauri/Cargo.toml --locked -- -D warnings

  package:
    name: Package MSI/NSIS installer (manual)
    # 打包链路较慢并可能需要额外的 WiX/NSIS 与签名配置;不阻塞 PR,
    # 仅在手动触发时运行,用于验证 cargo tauri build 端到端产物。
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    needs: quality

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/reader-web/package-lock.json

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Install shared reader dependencies
        run: npm ci --prefix packages/reader-web --no-audit --no-fund

      # tauri-cli 用 --locked 固定其自身依赖;beforeBuildCommand 会自动执行
      # packages/reader-web 的 build:windows 生成 dist-windows。
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri bundle
        # working-directory 已是 src-tauri，Tauri 自动读取同目录 tauri.conf.json。
        run: cargo tauri build
        working-directory: apps/windows/src-tauri

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flux-reader-windows-installers
          path: |
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7
