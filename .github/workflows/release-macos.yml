name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate macOS release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
      complete: ${{ steps.release.outputs.complete }}
    steps:
      - name: Reject non-main runs
        if: ${{ github.ref != 'refs/heads/main' }}
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate version and release notes
        id: version
        run: |
          node scripts/sync-version.js --check --platform macos --github-output
          node scripts/prepare-release-notes.js --platform macos --check
      - name: Inspect immutable release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail
          complete=false
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-list -n 1 "refs/tags/$TAG")" == "$GITHUB_SHA" ]] || { echo "$TAG 已用于其他提交，请提升 macOS 版本号。" >&2; exit 1; }
            release_json="$(gh release view "$TAG" --json isDraft,assets)"
            [[ "$(jq -r '.isDraft' <<<"$release_json")" == "false" ]] || { echo "$TAG 存在未完成草稿。" >&2; exit 1; }
            for file in "$ASSET" SHA256SUMS; do jq -e --arg name "$file" '.assets[] | select(.name == $name)' <<<"$release_json" >/dev/null; done
            complete=true
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 的 Release 与本地 tag 状态不一致。" >&2
            exit 1
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

  quality:
    name: macOS quality gate
    needs: metadata
    if: ${{ needs.metadata.outputs.complete != 'true' }}
    uses: ./.github/workflows/_quality-macos.yml

  build:
    name: Build unnotarized Universal DMG
    needs: [metadata, quality]
    if: ${{ needs.metadata.outputs.complete != 'true' }}
    runs-on: macos-26
    timeout-minutes: 35
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/reader-web/package-lock.json
      - name: Install shared reader dependencies
        run: npm ci --prefix packages/reader-web --no-audit --no-fund
      - name: Build DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          DERIVED_DATA: ${{ runner.temp }}/FluxReaderRelease
          OUTPUT_DIR: ${{ github.workspace }}/dist/release
          DMG_ASSET: ${{ needs.metadata.outputs.asset }}
        run: |
          npm run pack:macos
          test -s "dist/release/$DMG_ASSET"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-${{ github.run_id }}
          path: dist/release/${{ needs.metadata.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish macOS Release
    needs: [metadata, build]
    if: ${{ needs.metadata.outputs.complete != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-${{ github.run_id }}
          path: dist/release
      - name: Publish immutable platform release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          ASSET: ${{ needs.metadata.outputs.asset }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          node scripts/prepare-release-notes.js --platform macos --output "$NOTES"
          cd dist/release
          sha256sum "$ASSET" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          cd ../..
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$TAG" || gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG 在构建期间出现，拒绝覆盖。" >&2; exit 1; fi
          gh release create "$TAG" "dist/release/$ASSET" dist/release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Flux Reader macOS $VERSION" --notes-file "$NOTES"
