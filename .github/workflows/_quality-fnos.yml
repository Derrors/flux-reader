name: fnOS Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Test and build fnOS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_REPLACE_REGISTRY_HOST: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/fnos/backend/package-lock.json
            packages/reader-web/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci --prefix apps/fnos/backend --no-audit --no-fund
          npm ci --prefix packages/reader-web --no-audit --no-fund

      - name: Validate fnOS version and tests
        run: |
          npm run version:check:fnos
          npm run test:release
          npm run test:fnos
          npm run test:reader

      - name: Test built reader entries in Chromium
        run: npm run test:render-contract

      - name: Build fnOS production app
        run: npm run build:fnos
